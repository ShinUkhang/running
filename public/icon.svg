<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- 러너 네온 그라데이션 -->
    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <!-- 스피드 라인 글로우 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 둥근 앱 아이콘 배경 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- 원형 테두리 네온 링 -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="url(#runnerGrad)" stroke-width="8" stroke-dasharray="16 10" opacity="0.4"/>

  <!-- 역동적인 스피드 라인 (트랙) -->
  <path d="M 90 380 Q 256 420 422 360" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M 120 410 Q 256 445 392 395" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- 달리는 사람 (러너) 실루엣 -->
  <g fill="url(#runnerGrad)" filter="url(#glow)">
    <!-- 머리 -->
    <circle cx="330" cy="120" r="42"/>
    
    <!-- 몸통 & 팔 & 다리 역동적 러닝 자세 -->
    <!-- 상체 -->
    <path d="M 285 165 L 340 180 L 295 285 L 245 255 Z"/>
    
    <!-- 앞쪽 팔 -->
    <path d="M 325 180 L 390 215 L 425 190" fill="none" stroke="url(#runnerGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 뒤쪽 팔 -->
    <path d="M 275 195 L 210 210 L 195 255" fill="none" stroke="url(#runnerGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 앞쪽 다리 (무릎 높이 든 자세) -->
    <path d="M 285 275 L 355 325 L 340 415" fill="none" stroke="url(#runnerGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 뒤쪽 다리 (박차고 나가는 자세) -->
    <path d="M 255 260 L 175 315 L 120 330" fill="none" stroke="url(#runnerGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 번개 속도 효과 -->
  <path d="M 370 80 L 350 110 L 380 110 L 345 150" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
